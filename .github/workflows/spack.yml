name: Check Spack Installation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# a new push to a pull request cancels the run still going on its previous commit (runs on main are never cancelled)
concurrency:
  group: spack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
  
    - name: Set up Spack
      uses: spack/setup-spack@v2
      with:
        ref: v1.1.0      # Spack version (examples: develop, releases/v0.21)
        buildcache: true  # Configure oci://ghcr.io/spack/github-actions-buildcache
        color: true       # Force color output (SPACK_COLOR=always)
        path: spack       # Where to clone Spack

    - name: Install exaStamp With Spack
      run: |
        git clone https://github.com/Collab4exaNBody/spack-repos.git
        spack repo add spack-repos
        spack install -v exastamp
