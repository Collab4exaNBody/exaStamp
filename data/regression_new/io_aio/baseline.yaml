# Usage examples of the aio-based atom readers (src/io): each deck reads the same
# small Ta BCC system (1024 atoms, with velocities) in another format, then runs
# 20 EAM steps. Inputs: Ta_bcc.{lmp,lmp.gz,xyz,dump,h5}.
species:
  - Ta: { mass: 180.95 Da, z: 73, charge: 0 e- }

eam_alloy_force:
  rcut: 6.6825 ang
  parameters:
    file: "Ta1_Ravelo_2013.eam.alloy"
  eam_rho: true
  eam_rho2emb: true
  eam_ghost: true
  eam_force: true
  eam_symmetry: false

compute_force:
  - eam_alloy_force

global:
  dt: 1e-3 ps
  rcut_inc: 2.0 ang
  simulation_snapshot_frequency: -1
  simulation_analysis_frequency: -1
  simulation_thermostate_file_frequency: -1
  simulation_thermostate_screen_frequency: 10
  max_iteration: 20
