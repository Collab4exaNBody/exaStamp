# TATB force field (Bedrov et al.) converted from data/potentials/FAtomes_tatb_gas + DONNEES_tatb_gas by
# scripts/python/fatomes_to_yaml.py --molecule TATB --strip-prefix TATB_ (also writes tatb_isolated_molecule.xyz).
# Use it with read_xyz_molecules followed by molecule_force_field in setup_system.
species:
  - Cno2: { mass: 0.012011 kg/mol, charge: 0.34068 e-, molecule: TATB }
  - Cnh2: { mass: 0.012011 kg/mol, charge: -0.243 e-, molecule: TATB }
  - No2: { mass: 0.014 kg/mol, charge: 0.6798 e-, molecule: TATB }
  - Nh2: { mass: 0.014 kg/mol, charge: -0.693 e-, molecule: TATB }
  - O: { mass: 0.016 kg/mol, charge: -0.51024 e-, molecule: TATB, ff: O_ }
  - H: { mass: 0.001008 kg/mol, charge: 0.468 e-, molecule: TATB, ff: H_ }

molecule_force_field:
  rf_self_pairs: true
  long_range_correction: true
  potentials_for_bonds:
    - { types: [Cno2, Cnh2], potential: opls_bond, parameters: { r0: 1.440 ang, k: 250.0 kcal/mol/ang^2 } }
    - { types: [Cno2, No2], potential: opls_bond, parameters: { r0: 1.427 ang, k: 150.0 kcal/mol/ang^2 } }
    - { types: [Cnh2, Nh2], potential: opls_bond, parameters: { r0: 1.322 ang, k: 336.0 kcal/mol/ang^2 } }
    - { types: [No2, O_], potential: opls_bond, parameters: { r0: 1.230 ang, k: 439.0 kcal/mol/ang^2 } }
    - { types: [Nh2, H_], potential: opls_bond, parameters: { r0: 1.010 ang, k: 425.0 kcal/mol/ang^2 } }
  potentials_for_angles:
    - { types: [Cno2, Cnh2, Cno2], potential: opls_bend, parameters: { theta0: 118.4 degree, k: 32.0 kcal/mol } }
    - { types: [Cno2, Cnh2, Nh2], potential: opls_bend, parameters: { theta0: 121.7 degree, k: 30.0 kcal/mol } }
    - { types: [Cno2, No2, O_], potential: opls_bend, parameters: { theta0: 116.8 degree, k: 70.0 kcal/mol } }
    - { types: [Cnh2, Cno2, Cnh2], potential: opls_bend, parameters: { theta0: 121.6 degree, k: 32.0 kcal/mol } }
    - { types: [Cnh2, Cno2, No2], potential: opls_bend, parameters: { theta0: 119.2 degree, k: 30.0 kcal/mol } }
    - { types: [Cnh2, Nh2, H_], potential: opls_bend, parameters: { theta0: 112.0 degree, k: 32.0 kcal/mol } }
    - { types: [O_, No2, O_], potential: opls_bend, parameters: { theta0: 117.3 degree, k: 47.5 kcal/mol } }
    - { types: [H_, Nh2, H_], potential: opls_bend, parameters: { theta0: 119.0 degree, k: 32.0 kcal/mol } }
  potentials_for_torsions:
    - { types: [Cno2, Cnh2, Cno2, Cnh2], potential: 0.5compass_torsion, parameters: { k1: 0.0 kcal/mol, k2: 5.35 kcal/mol, k3: 0.0 kcal/mol } }
    - { types: [Cno2, Cnh2, Cno2, No2], potential: 0.5compass_torsion, parameters: { k1: 0.0 kcal/mol, k2: 20.0 kcal/mol, k3: 0.0 kcal/mol } }
    - { types: [Cno2, Cnh2, Nh2, H_], potential: 0.5compass_torsion, parameters: { k1: 0.0 kcal/mol, k2: 8.88 kcal/mol, k3: 0.0 kcal/mol } }
    - { types: [Cnh2, Cno2, Cnh2, Nh2], potential: 0.5compass_torsion, parameters: { k1: 0.0 kcal/mol, k2: 20.0 kcal/mol, k3: 0.0 kcal/mol } }
    - { types: [Cnh2, Cno2, No2, O_], potential: 0.5compass_torsion, parameters: { k1: 0.0 kcal/mol, k2: 1.60 kcal/mol, k3: 0.0 kcal/mol } }
    - { types: [Nh2, Cnh2, Cno2, No2], potential: 0.5compass_torsion, parameters: { k1: 0.0 kcal/mol, k2: 20.0 kcal/mol, k3: 0.0 kcal/mol } }
  potentials_for_impropers:
    - { types: [Cno2, Cnh2, Cnh2, No2], potential: harm_improper, parameters: { chi0: 0.0 degree, k: 36.5 kcal/mol } }
    - { types: [Cnh2, Cno2, Cno2, Nh2], potential: harm_improper, parameters: { chi0: 0.0 degree, k: 36.5 kcal/mol } }
    - { types: [No2, Cno2, O_, O_], potential: harm_improper, parameters: { chi0: 0.0 degree, k: 89.3 kcal/mol } }
    - { types: [Nh2, Cnh2, H_, H_], potential: harm_improper, parameters: { chi0: 0.0 degree, k: 2.1 kcal/mol } }
  mol_pair_weights:
    Cno2_Cno2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cno2_Cnh2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cno2_No2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cno2_Nh2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cno2_O: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cno2_H: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cnh2_Cnh2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cnh2_No2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cnh2_Nh2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cnh2_O: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Cnh2_H: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    No2_No2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    No2_Nh2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    No2_O: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    No2_H: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Nh2_Nh2: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Nh2_O: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    Nh2_H: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    O_O: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    O_H: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
    H_H: { bond: 0.0, bend: 0.0, torsion: 0.4, bond_rf: 0.0, bend_rf: 0.0, torsion_rf: 0.76 }
  potentials_for_pairs:
    - { type_a: Cno2, type_b: Cno2, potential: { rcut: 11.0 ang, exp6: { A: 107023.9 kcal/mol, B: 3.6405 ang^-1, C: 554.01 kcal/mol*ang^6, D: 5e-05 kcal/mol }, rf: { epsilon: 50.0, rc: 12.5 ang } } }
    - { type_a: Cno2, type_b: Cnh2, potential: { rcut: 12.5 ang, exp6: { A: 107023.9 kcal/mol, B: 3.6405 ang^-1, C: 554.01 kcal/mol*ang^6, D: 5e-05 kcal/mol }, rf: { epsilon: 50.0, rc: 12.5 ang } } }
    - { type_a: Cno2, type_b: No2, potential: { rcut: 12.5 ang, exp6: { A: 37111.29 kcal/mol, B: 3.4635003 ang^-1, C: 484.2991571 kcal/mol*ang^6, D: 5e-05 kcal/mol }, rf: { epsilon: 50.0, rc: 12.5 ang } } }
    - { type_a: Cno2, type_b: Nh2, potential: { rcut: 12.5 ang, exp6: { A: 62222.18 kcal/mol, B: 3.45198059 ang^-1, C: 679.5264931 kcal/mol*ang^6, D: 5e-05 kcal/mol }, rf: { epsilon: 50.0, rc: 12.5 ang } } }
    - { type_a: Cno2, type_b: O, potential: { rcut: 12.5 ang, exp6: { A: 41281.14 kcal/mol, B: 3.64254596 ang^-1, C: 363.9329206 kcal/mol*ang^6, D: 5e-05 kcal/mol }, rf: { epsilon: 50.0, rc: 12.5 ang } } }
