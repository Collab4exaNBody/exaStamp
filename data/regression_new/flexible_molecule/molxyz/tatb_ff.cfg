    - { type_a: Cnh2, type_b: Cnh2, potential: { rcut: 11.0 ang, exp6: { A: 107023.9 kcal/mol, B: 3.6405 ang^-1, C: 554.01 kcal/mol*ang^6, D: 5e-05 kcal/mol }, rf: { epsilon: 50.0, rc: 12.5 ang } } }
