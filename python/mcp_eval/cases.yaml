  reference:
    species: [{name: Al}, {name: Cu}]
    system: {kind: lattice, structure: FCC, lattice_parameter: 3.8 ang, repeats: [9, 9, 9], types: [Al, Cu, Cu, Al]}
    potential: {kind: eam_alloy, file: AlCu.eam.alloy}
    ensemble: {kind: langevin, temperature: 600 K}
    steps: 3000

