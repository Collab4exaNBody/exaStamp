  expect: {potential: eam_alloy_force, scheme: verlet_lnvt, species: [Ta], structure: BCC, atoms: 8192, temperature: 3000, steps: 50000}
  reference:
    species: [{name: Ta}]
    system: {kind: lattice, structure: BCC, lattice_parameter: 3.3026 ang, repeats: [16, 16, 16]}
    potential: {kind: eam_alloy, file: Ta1_Ravelo_2013.eam.alloy}
    ensemble: {kind: langevin, temperature_start: 300 K, temperature_stop: 3000 K}
    steps: 50000
    outputs: {thermo_every: 100, restart_every: 10000}

