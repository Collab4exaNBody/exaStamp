# Evaluation set of the exaStamp MCP server: simulation requests, as a user would
# write them, with machine-checkable expectations on the input the agent writes.
#
# expect:
#   potential     force operator that must be in compute_force
#   scheme        numerical_scheme
#   species       species names that must be declared
#   structure     lattice structure in setup_system
#   atoms         particle count after the smoke run
#   temperature   target or initial temperature (K) that must appear
#   steps         global.max_iteration
#   snapshot      write_snapshot value
# reference: a SimulationSpec reaching the expectations (run_eval.py --reference
# checks that every case is feasible with this install, without any LLM).

- id: ta_bcc_eam_nvt
  prompt: "Ta BCC, 20x20x20 unit cells, EAM potential of Ravelo 2013 (Ta1), Langevin NVT at 300 K for 10 ps with a 1 fs time step, xyz snapshot every 1 ps."
  expect: {potential: eam_alloy_force, scheme: verlet_lnvt, species: [Ta], structure: BCC, atoms: 16000, temperature: 300, steps: 10000, snapshot: write_snapshot_xyz}
  reference:
    species: [{name: Ta}]
    system: {kind: lattice, structure: BCC, lattice_parameter: 3.3026 ang, repeats: [20, 20, 20]}
    potential: {kind: eam_alloy, file: Ta1_Ravelo_2013.eam.alloy}
    ensemble: {kind: langevin, temperature: 300 K}
    steps: 10000
    outputs: {snapshot: xyz, snapshot_every: 1000}

- id: cu_fcc_eam_nve
  prompt: "Copper FCC crystal, 10 cells per side, lattice parameter 3.615 Angstrom, Cu EAM alloy potential, NVE starting from 500 K, 5000 steps."
  expect: {potential: eam_alloy_force, scheme: verlet_nve, species: [Cu], structure: FCC, atoms: 4000, temperature: 500, steps: 5000}
  reference:
    species: [{name: Cu}]
    system: {kind: lattice, structure: FCC, lattice_parameter: 3.615 ang, repeats: [10, 10, 10]}
    potential: {kind: eam_alloy, file: Cu.eam.alloy}
    initial_temperature: 500 K
    steps: 5000

- id: cu_fcc_langevin
  prompt: "Thermalize an FCC copper box of 12x12x12 cells (a = 3.615 A) at 800 K with a Langevin thermostat (friction 1 ps^-1), 20000 steps of 2 fs."
  expect: {potential: eam_alloy_force, scheme: verlet_lnvt, species: [Cu], structure: FCC, atoms: 6912, temperature: 800, steps: 20000}
  reference:
    species: [{name: Cu}]
    system: {kind: lattice, structure: FCC, lattice_parameter: 3.615 ang, repeats: [12, 12, 12]}
    potential: {kind: eam_alloy, file: Cu.eam.alloy}
    ensemble: {kind: langevin, temperature: 800 K, gamma: 1.0 ps^-1}
    timestep: 2.0e-3 ps
    steps: 20000

- id: ar_lj_nve
  prompt: "Liquid-like argon with Lennard-Jones (epsilon 0.0104 eV, sigma 3.4 A, cutoff 8.5 A), FCC start a = 5.26 A, 8x8x8 cells, NVE from 90 K for 2000 steps."
  expect: {potential: lj_compute_force, scheme: verlet_nve, species: [Ar], structure: FCC, atoms: 2048, temperature: 90, steps: 2000}
  reference:
    species: [{name: Ar}]
    system: {kind: lattice, structure: FCC, lattice_parameter: 5.26 ang, repeats: [8, 8, 8]}
    potential: {kind: lj, epsilon: 0.0104 eV, sigma: 3.4 ang, rcut: 8.5 ang}
    initial_temperature: 90 K
    steps: 2000

- id: ar_lj_berendsen
  prompt: "Argon LJ crystal (FCC 5.26 A, 6x6x6 cells, epsilon 0.0104 eV, sigma 3.4 A, rcut 2.5 sigma) heated from 20 K to 60 K with a Berendsen thermostat over 5000 steps."
  expect: {potential: lj_compute_force, scheme: verlet_bnvt, species: [Ar], structure: FCC, atoms: 864, temperature: 60, steps: 5000}
  reference:
    species: [{name: Ar}]
    system: {kind: lattice, structure: FCC, lattice_parameter: 5.26 ang, repeats: [6, 6, 6]}
    potential: {kind: lj, epsilon: 0.0104 eV, sigma: 3.4 ang, rcut: 8.5 ang}
    ensemble: {kind: berendsen, temperature_start: 20 K, temperature_stop: 60 K}
    steps: 5000

- id: alcu_alloy
